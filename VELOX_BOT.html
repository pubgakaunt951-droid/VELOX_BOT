<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VELOX UC SHOP</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0d0d0d;
color:white;
padding:15px;
}

.logo{
text-align:center;
font-size:30px;
font-weight:bold;
color:#FFD700;
margin-top:20px;
}

.slogan{
text-align:center;
color:#aaa;
margin-bottom:20px;
}

.banner{
background:linear-gradient(135deg,#FFD700,#ff9800);
padding:25px;
border-radius:15px;
text-align:center;
font-size:22px;
font-weight:bold;
color:black;
margin-bottom:20px;
}

.card{
background:#1a1a1a;
padding:15px;
border-radius:15px;
margin-bottom:15px;
}

.balance{
font-size:22px;
color:#FFD700;
font-weight:bold;
}

.btn{
display:block;
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#FFD700;
color:black;
font-size:16px;
font-weight:bold;
margin-top:10px;
cursor:pointer;
}

.category{
background:#1a1a1a;
padding:15px;
border-radius:15px;
margin-top:15px;
}

.category h2{
color:#FFD700;
margin-bottom:10px;
}

.item{
background:#262626;
padding:12px;
border-radius:10px;
margin-top:8px;
}
</style>
</head>

<body>

<div class="logo">VELOX UC SHOP</div>
<div class="slogan">⚡ FAST • SAFE • CHEAP ⚡</div>

<div class="banner">
PUBG MOBILE UC STORE
</div>

<div class="card">
<div class="balance">Баланс: 0 ₽</div>
<p>ID Telegram: 123456789</p>

<button class="btn">Пополнить баланс</button>
<button class="btn">Мои заказы</button>
<button class="btn">Отзывы</button>
<button class="btn">Поддержка</button>
</div>

<div class="category">
<h2>UC PUBG Mobile</h2>

<div class="item">60 UC</div>
<div class="item">325 UC</div>
<div class="item">660 UC</div>
<div class="item">1800 UC</div>
<div class="item">3850 UC</div>
<div class="item">8100 UC</div>
<div class="item">Custom UC</div>
</div>

<div class="category">
<h2>Prime</h2>
<div class="item">Prime</div>
</div>

<div class="category">
<h2>Prime Plus</h2>
<div class="item">Prime Plus</div>
</div>

<div class="category">
<h2>Подарок</h2>
<div class="item">10 000 UC - 1 000 000 UC</div>
</div>

</body>
</html>
