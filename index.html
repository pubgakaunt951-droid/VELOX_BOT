<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELOX UC SHOP</title>
    <link rel="stylesheet" href="style.css">
    <!-- Иконаҳо (FontAwesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Шапка (Header) -->
    <header class="header">
        <div class="menu-btn"><i class="fa-solid fa-bars"></i></div>
        
        <div class="logo">
            <i class="fa-solid fa-crown logo-crown"></i>
            <h1>VELOX</h1>
            <span>UC SHOP</span>
        </div>

        <div class="balance-box">
            <div class="balance-info">
                <span class="title">Баланс</span>
                <span class="amount">0.00 сомони</span>
            </div>
            <button class="add-btn">+</button>
        </div>
    </header>

    <!-- Баннер (Banner) -->
    <div class="banner">
        <div class="banner-content">
            <h2>PLAY BIGGER</h2>
            <h3>BE A LEGEND</h3>
        </div>
    </div>

    <!-- Секцияи Категорияҳо (Grid Cards) -->
    <main class="main-content">
        <div class="card">
            <div class="card-bg uc-bg"></div>
            <div class="card-footer">
                <h3>UC SHOP</h3>
                <i class="fa-solid fa-chevron-right"></i>
            </div>
        </div>

        <div class="card">
            <div class="card-bg account-bg"></div>
            <div class="card-footer">
                <h3>AKAKUNT</h3>
                <i class="fa-solid fa-chevron-right"></i>
            </div>
        </div>

        <div class="card">
            <div class="card-bg xsuit-bg"></div>
            <div class="card-footer">
                <h3>X-SUIT</h3>
                <i class="fa-solid fa-chevron-right"></i>
            </div>
        </div>

        <div class="card">
            <div class="card-bg supercar-bg"></div>
            <div class="card-footer">
                <h3>SUPERCAR</h3>
                <i class="fa-solid fa-chevron-right"></i>
            </div>
        </div>
    </main>

    <!-- Менюи поёнӣ (Bottom Navigation) -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item active">
            <i class="fa-solid fa-house"></i>
            <span>Главный</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fa-solid fa-star"></i>
            <span>Отзывы</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fa-solid fa-cart-shopping"></i>
            <span>Заказы</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fa-solid fa-user"></i>
            <span>Профиль</span>
        </a>
    </nav>

</body>
</html>
