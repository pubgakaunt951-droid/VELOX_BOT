<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VELOX UC SHOP</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #08080a;
      color: #ffffff;
      padding-bottom: 80px;
    }

    /* Top Bar */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 16px;
      background: linear-gradient(180deg, rgba(20,20,25,0.9) 0%, rgba(8,8,10,0) 100%);
    }

    .menu-btn {
      font-size: 22px;
      color: #d4af37;
      cursor: pointer;
    }

    .logo-container {
      text-align: center;
    }

    .logo-title {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1.5px;
      background: linear-gradient(180deg, #fff 0%, #e6ca65 50%, #997a15 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .logo-subtitle {
      font-size: 11px;
      color: #d4af37;
      letter-spacing: 2px;
      font-weight: bold;
      margin-top: -3px;
    }

    .balance-card {
      background: rgba(255, 215, 0, 0.08);
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 12px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .balance-title {
      font-size: 10px;
      color: #aaa;
    }

    .balance-amount {
      font-size: 13px;
      font-weight: bold;
      color: #fff;
    }

    .add-btn {
      background: #d4af37;
      color: #000;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Pages */
    .page {
      display: none;
      padding: 0 16px;
    }

    .page.active {
      display: block;
    }

    /* Banner */
    .banner {
      width: 100%;
      border-radius: 16px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      margin-bottom: 20px;
      background: linear-gradient(135deg, #1a1a24 0%, #0d0d12 100%);
      overflow: hidden;
    }

    .banner img {
      width: 100%;
      display: block;
      border-radius: 16px;
    }

    /* Grid Categories */
    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .card {
      background: #121218;
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:active {
      transform: scale(0.97);
      border-color: #d4af37;
    }

    .card-img-wrapper {
      height: 140px;
      width: 100%;
      overflow: hidden;
    }

    .card-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-footer {
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, #14141c 0%, #0a0a0e 100%);
    }

    .card-title {
      font-size: 15px;
      font-weight: 800;
      font-style: italic;
      color: #fff;
    }

    .card-arrow {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid rgba(212, 175, 55, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d4af37;
      font-size: 12px;
    }

    /* UC Page */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #d4af37;
      font-size: 14px;
      margin-bottom: 16px;
      cursor: pointer;
      font-weight: bold;
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .uc-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .uc-card {
      background: #14141c;
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
