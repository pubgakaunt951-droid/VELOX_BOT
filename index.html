<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VELOX UC SHOP</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #08080a;
      color: #ffffff;
      padding-bottom: 80px;
    }

    /* Top Bar */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 16px;
      background: linear-gradient(180deg, rgba(20,20,25,0.9) 0%, rgba(8,8,10,0) 100%);
    }

    .menu-btn {
      font-size: 22px;
      color: #d4af37;
      cursor: pointer;
    }

    .logo-container {
      text-align: center;
    }

    .logo-title {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1.5px;
      background: linear-gradient(180deg, #fff 0%, #e6ca65 50%, #997a15 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .logo-subtitle {
      font-size: 11px;
      color: #d4af37;
      letter-spacing: 2px;
      font-weight: bold;
      margin-top: -3px;
    }

    .balance-card {
      background: rgba(255, 215, 0, 0.08);
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 12px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .balance-title {
      font-size: 10px;
      color: #aaa;
    }

    .balance-amount {
      font-size: 13px;
      font-weight: bold;
      color: #fff;
    }

    .add-btn {
      background: #d4af37;
      color: #000;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Page Views */
    .page {
      display: none;
      padding: 0 16px;
    }

    .page.active {
      display: block;
    }

    /* Banner */
    .banner {
      width: 100%;
      border-radius: 16px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      margin-bottom: 20px;
      background: linear-gradient(135deg, #1a1a24 0%, #0d0d12 100%);
      overflow: hidden;
      position: relative;
    }

    .banner img {
      width: 100%;
      display: block;
      border-radius: 16px;
    }

    /* Grid Categories */
    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .card {
      background: #121218;
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:active {
      transform: scale(0.97);
      border-color: #d4af37;
    }

    .card-img-wrapper {
      height: 140px;
      width: 100%;
      overflow: hidden;
      position: relative;
    }

    .card-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-footer {
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, #14141c 0%, #0a0a0e 100%);
    }

    .card-title {
      font-size: 15px;
      font-weight: 800;
      font-style: italic;
      color: #fff;
    }

    .card-arrow {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid rgba(212, 175, 55, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d4af37;
      font-size: 12px;
    }

    /* UC Shop Screen */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #d4af37;
      font-size: 14px;
      margin-bottom: 16px;
      cursor: pointer;
      font-weight: bold;
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .uc-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .uc-card {
      background: #14141c;
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      cursor: pointer;
    }

    .uc-card.selected {
      border-color: #d4af37;
      background: rgba(212, 175, 55, 0.08);
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.2);
    }

    .uc-icon {
      width: 42px;
      height: 42px;
      margin-bottom: 8px;
    }

    .uc-amount {
      font-size: 16px;
      font-weight: 800;
      color: #fff;
    }

    .uc-bonus {
      font-size: 11px;
      color: #2ed573;
      font-weight: bold;
      margin-top: 2px;
    }

    .uc-price {
      margin-top: 10px;
      background: #d4af37;
      color: #000;
      font-size: 13px;
      font-weight: bold;
      padding: 4px 12px;
      border-radius: 8px;
    }

    /* Checkout Bar */
    .checkout-bar {
      position: fixed;
      bottom: 75px;
      left: 16px;
      right: 16px;
      background: #1a1a24;
      border: 1px solid #d4af37;
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      z-index: 99;
    }

    .checkout-info {
      display: flex;
      flex-direction: column;
    }

    .checkout-uc {
      font-size: 15px;
      font-weight: bold;
      color: #d4af37;
    }

    .checkout-price {
      font-size: 13px;
      color: #ccc;
    }

    .buy-btn {
      background: linear-gradient(180deg, #e6ca65 0%, #997a15 100%);
      color: #000;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 900;
      cursor: pointer;
      text-transform: uppercase;
    }

    /* Bottom Navigation */
    .navbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: #0d0d12;
      border-top: 1px solid rgba(212, 175, 55, 0.3);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #777;
      font-size: 11px;
      text-decoration: none;
      cursor: pointer;
      gap: 4px;
    }

    .nav-item.active {
      color: #d4af37;
    }

    .nav-item i {
      font-size: 18px;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="header">
    <div class="menu-btn"><i class="fa-solid fa-bars"></i></div>
    <div class="logo-container">
      <div class="logo-title">VELOX</div>
      <div class="logo-subtitle">UC SHOP</div>
    </div>
    <div class="balance-card">
      <div>
        <div class="balance-title">Баланс</div>
        <div class="balance-amount">0.00 сомони</div>
      </div>
      <button class="add-btn">+</button>
    </div>
  </div>

  <!-- Main Page -->
  <div id="main-page" class="page active">
    <!-- Banner -->
    <div class="banner">
      <img src="https://via.placeholder.com/600x200/121218/d4af37?text=PUBG+MOBILE+PLAY+BIGGER" alt="Banner">
    </div>

    <!-- Category Grid -->
    <div class="grid-container">
      <div class="card" onclick="openCategory('uc')">
        <div class="card-img-wrapper">
          <img src="https://via.placeholder.com/300x300/1a1a24/d4af37?text=UC+SHOP" alt="UC">
        </div>
        <div class="card-footer">
          <div class="card-title">UC SHOP</div>
          <div class="card-arrow"><i class="fa-solid fa-chevron-right"></i></div>
        </div>
      </div>

      <div class="card">
        <div class="card-img-wrapper">
          <img src="https://via.placeholder.com/300x300/1a1a24/d4af37?text=ACCOUNT" alt="Account">
        </div>
        <div class="card-footer">
          <div class="card-title">АККАУНТ</div>
          <div class="card-arrow"><i class="fa-solid fa-chevron-right"></i></div>
        </div>
      </div>

      <div class="card">
        <div class="card-img-wrapper">
          <img src="https://via.placeholder.com/300x300/1a1a24/d4af37?text=X-SUIT" alt="X-Suit">
        </div>
        <div class="card-footer">
          <div class="card-title">X-SUIT</div>
          <div class="card-arrow"><i class="fa-solid fa-chevron-right"></i></div>
        </div>
      </div>

      <div class="card">
        <div class="card-img-wrapper">
          <img src="https://via.placeholder.com/300x300/1a1a24/d4af37?text=SUPERCAR" alt="Supercar">
        </div>
        <div class="card-footer">
          <div class="card-title">SUPERCAR</div>
          <div class="card-arrow"><i class="fa-solid fa-chevron-right"></i></div>
        </div>
      </div>
    </div>
  </div>

  <!-- UC Shop Page -->
  <div id="uc-page" class="page">
    <div class="back-btn" onclick="openCategory('main')">
      <i class="fa-solid fa-arrow-left"></i> Ба ақиб
    </div>

    <div class="section-title">
      <i class="fa-solid fa-coins" style="color: #d4af37;"></i> Хариди UC
    </div>

    <div class="uc-grid" id="uc-list">
      <!-- Items generated dynamically via JS -->
    </div>
  </div>

  <!-- Floating Checkout Bar -->
  <div id="checkout-bar" class="checkout-bar" style="display: none;">
    <div class="checkout-info">
      <div id="selected-uc-text" class="checkout-uc">0 UC</div>
      <div id="selected-price-text" class="checkout-price">Сомони: 0 см</div>
    </div>
    <button class="buy-btn" onclick="buyUC()">Харидан</button>
  </div>

  <!-- Bottom Navigation -->
  <div class="navbar">
    <div class="nav-item active" onclick="openCategory('main')">
      <i class="fa-solid fa-house"></i>
      <span>Главный</span>
    </div>
    <div class="nav-item">
      <i class="fa-solid fa-star"></i>
      <span>Отзывы</span>
    </div>
    <div class="nav-item">
      <i class="fa-solid fa-cart-shopping"></i>
      <span>Заказы</span>
    </div>
    <div class="nav-item">
      <i class="fa-solid fa-user"></i>
      <span>Профиль</span>
    </div>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) tg.expand();

    // Прайс-лист мувофиқи сурат
    const ucPricelist = [
      { base: 30, bonus: 0, price: 5 },
      { base: 60, bonus: 60, price: 10 },
      { base: 120, bonus: 0, price: 20 },
      { base: 180, bonus: 0, price: 30 },
      { base: 325, bonus: 0, price: 47 },
      { base: 355, bonus: 0, price: 58 },
      { base: 385, bonus: 0, price: 62 },
      { base: 660, bonus: 0, price: 90 },
      { base: 720, bonus: 0, price: 100 },
      { base: 1440, bonus: 0, price: 195 },
      { base: 1800, bonus: 0, price: 230 },
      { base: 3850, bonus: 0, price: 430 },
      { base: 4570, bonus: 0, price: 520 },
      { base: 8100, bonus: 0, price: 880 },
      { base: 16200, bonus: 0, price: 1700 }
    ];

    let selectedItem = null;

    function renderUCOptions() {
      const container = document.getElementById('uc-list');
      container.innerHTML = '';

      ucPricelist.forEach((item, index) => {
        const totalUC = item.base + item.bonus;
        const ucDisplay = item.bonus > 0 ? `${item.base} + ${item.bonus}` : `${item.base}`;

        const card = document.createElement('div');
        card.className = `uc-card ${selectedItem === index ? 'selected' : ''}`;
        card.onclick = () => selectUC(index);

        card.innerHTML = `
          <div class="uc-amount">${ucDisplay} UC</div>
          <div class="uc-bonus">= ${totalUC} UC</div>
          <div class="uc-price">${item.price} сомони</div>
        `;

        container.appendChild(card);
      });
    }

    function selectUC(index) {
      selectedItem = index;
      renderUCOptions();

      const item = ucPricelist[index];
      const totalUC = item.base + item.bonus;

      document.getElementById('selected-uc-text').innerText = `${totalUC} UC (${item.base}${item.bonus ? ' + ' + item.bonus : ''})`;
      document.getElementById('selected-price-text').innerText = `Нарх: ${item.price} сомони`;
      document.getElementById('checkout-bar').style.display = 'flex';
    }

    function openCategory(cat) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      if (cat === 'uc') {
        document.getElementById('uc-page').classList.add('active');
        renderUCOptions();
      } else {
        document.getElementById('main-page').classList.add('active');
        document.getElementById('checkout-bar').style.display = 'none';
      }
    }

    function buyUC() {
      if (selectedItem === null) return;
      const item = ucPricelist[selectedItem];
      const total = item.base + item.bonus;
      
      if (tg) {
        tg.sendData(JSON.stringify({
          action: "buy_uc",
          uc_amount: total,
          price: item.price
        }));
      } else {
        alert(`Интихоб шуд: ${total} UC бо нархи ${item.price} сомони`);
      }
    }
  </script>
</body>
</html>
