<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELOX UC SHOP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Барномаи асосии Мобилӣ -->
    <div class="mobile-container">
        
        <!-- Сарлавҳа (Header) -->
        <header class="header">
            <div class="menu-btn">&#9776;</div>
            <div class="logo">
                <span class="gold-text">VELOX</span>
                <span class="sub-logo">UC SHOP</span>
                <p class="pubg-tag">PUBG MOBILE • FAST • SAFE • RELIABLE</p>
            </div>
            <div class="notification-btn">&#128276;<span class="badge"></span></div>
        </header>

        <!-- Қисмати Асосӣ (Main Content) -->
        <main class="content" id="main-content">
            <!-- Саҳифаи Асосӣ (Экран 1) -->
            <section id="home-screen" class="screen active">
                <div class="user-status-card">
                    <div class="user-level">
                        <span class="gold-text">&#128081; LEVEL 62</span>
                        <div class="progress-bar"><div class="progress" style="width: 82%;"></div></div>
                    </div>
                    <div class="balance-card">
                        <span>Баланс</span>
                        <span class="balance-amount">1250.00 <small>сом</small></span>
                    </div>
                </div>

                <div class="hero-banner">
                    <div class="hero-text">
                        <h2>UC PUBG MOBILE</h2>
                        <p>ТЕЗ • БОЭЪТИМОД • БЕХАТАР</p>
                        <button class="btn-primary" onclick="switchTab('shop')">ҲОЛО ХАРИД КУНЕД</button>
                    </div>
                </div>

                <!-- Навигатсияи зуд -->
                <div class="quick-nav">
                    <button class="nav-card" onclick="switchTab('shop')">
                        <span class="icon">&#128176;</span>
                        <span>UC Мағоза</span>
                    </button>
                    <button class="nav-card" onclick="switchTab('crates')">
                        <span class="icon">&#128230;</span>
                        <span>Қуттиҳо</span>
                    </button>
                    <button class="nav-card" onclick="switchTab('prime')">
                        <span class="icon">&#128150;</span>
                        <span>PRIME</span>
                    </button>
                    <button class="nav-card" onclick="switchTab('profile')">
                        <span class="icon">&#128100;</span>
                        <span>Профил</span>
                    </button>
                </div>
            </section>

            <!-- Дӯкон / Мағоза (Экран 2) -->
            <section id="shop-screen" class="screen">
                <h3 class="section-title">ХАРИДИ UC БАРОИ PUBG</h3>
                <div class="grid-container" id="uc-packages">
                    <!-- Маҷмӯъҳо бо сомонӣ -->
                </div>
            </section>

            <!-- Обунаи PRIME (Экран 4 ва 5) -->
            <section id="prime-screen" class="screen">
                <h3 class="section-title gold-text">&#128081; ОБУНАҲОИ PRIME</h3>
                <div class="prime-container">
                    <!-- Карточкаҳои PRIME ва PRIME PLUS ба воситаи JS илова мешаванд -->
                </div>
            </section>

            <!-- Фармоиш (Экран 6) -->
            <section id="order-screen" class="screen">
                <h3 class="section-title">БА ТАРТИБ ДАРОРДАНИ ФАРМОИШ</h3>
                <div class="order-box">
                    <div class="order-detail" id="selected-package-detail"></div>
                    <div class="input-group">
                        <label for="pubg-id">ID-и PUBG-и Шумо:</label>
                        <input type="text" id="pubg-id" placeholder="Масалан: 512345678">
                    </div>
                    <div class="input-group">
                        <label for="server">Интихоби Сервер:</label>
                        <select id="server">
                            <option>Global</option>
                            <option>Asia</option>
                            <option>Europe</option>
                        </select>
                    </div>
                    <button class="btn-confirm" onclick="confirmOrder()">Тасдиқи Фармоиш</button>
                </div>
            </section>
        </main>

        <!-- Менюи Поён (Navigation Bar) -->
        <nav class="bottom-nav">
            <button class="nav-item active" onclick="switchTab('home')">
                <span class="nav-icon">&#127968;</span>
                <span>Асосӣ</span>
            </button>
            <button class="nav-item" onclick="switchTab('shop')">
                <span class="nav-icon">&#128717;</span>
                <span>Мағоза</span>
            </button>
            <button class="nav-item" onclick="switchTab('prime')">
                <span class="nav-icon">&#128150;</span>
                <span>PRIME</span>
              <spin>AKRAMJONN</spin>
            </button>
            <button class="nav-item" onclick="switchTab('profile')">
                <span class="nav-icon">&#128100;</span>
                <span>Профил</span>
            </button>
        </nav>
    </div>

    <script src="script.js"></script>
</body>
</html>
